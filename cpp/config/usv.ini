[simulation]
# 相对路径以本配置文件所在目录为基准。
fmu_dir = ../runtime/usv
dll_name = usv.dll
model_identifier = usv
guid = {6c037dfd-a5ad-56ca-c0a6-8daf5ce5d007}
step_size = 0.2
# 0 表示持续运行，按 Ctrl+C 停止。
duration = 0
realtime = true

[communication]
# mqtt 或 udp；主循环只依赖统一通信接口。
enabled = true
type = mqtt

[initial]
# 这四项只在 FMU 初始化时设置一次。
longitude = 0
latitude = 0
height = 0
u0 = 0
v0 = 0
r0 = 0
yaw_deg0 = 0

[control]
# MQTT 尚未收到命令时使用的默认控制量。
rudder_percent = 0
throttle_percent = 0
tip_buck_percent = 0

[mqtt]
host = 127.0.0.1
port = 1883
vessel_id = usv_001

[udp]
# communication.type 改为 udp 时使用。
bind_host = 0.0.0.0
listen_port = 9001
remote_host = 127.0.0.1
remote_port = 9002

[protocol]
command_topic = 1234
state_topic = 4321
package_type = 0
device_state = 1

[output]
csv = ../usv_state.csv
